<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MMHL Standings</title>
    <link rel="icon" th:href="@{/assets/favicon.ico}" type="image/x-icon">
    <link rel="stylesheet" type="text/css" th:href="@{/styles/css/main.css}" />
    <link rel="stylesheet" type="text/css" th:href="@{/styles/css/stats-modern.css}" />
</head>
<body class="ms-body">
    <div th:replace="~{fragments/header.html :: header}"></div>

    <main class="ms-page"
          th:with="st=${request.seasonType().name()},
                   yr=${request.year()},
                   so=${request.sortOrder().toString()},
                   sf=${request.sortCategory().toString()}">

        <!-- Heading -->
        <section class="ms-heading">
            <div>
                <span class="ms-eyebrow"
                      th:text="|${yr} ${st == 'PLAYOFFS' ? 'Playoffs' : 'Regular Season'}|">2025 Regular Season</span>
                <h1 class="ms-title">Team Standings</h1>
            </div>
        </section>

        <!-- Summary tiles -->
        <section class="ms-summary" th:if="${!#lists.isEmpty(teamStats)}">
            <div class="ms-tile ms-tile-leader-card" th:with="leader=${teamStats[0]}">
                <div class="ms-tile-leader-info">
                    <span class="ms-tile-label">Current Leader</span>
                    <span class="ms-tile-value ms-tile-leader">
                        <img class="ms-logo ms-logo-sm"
                             th:src="@{'/assets/teamLogos/' + ${utils.stripSpaces(leader.teamName)} + '.svg'}"
                             th:alt="${leader.teamName}"
                             onerror="this.hidden=true;" />
                        <span th:text="${leader.teamName}">Team Name</span>
                    </span>
                    <span class="ms-tile-sub"
                          th:text="|${leader.wins}-${leader.losses}-${leader.ties}  ·  ${leader.points} pts|">0-0-0</span>
                </div>
                <div class="ms-leader-stat" th:switch="${sf}">
                    <th:block th:case="'GAMES_PLAYED'">
                        <span class="ms-leader-stat-val" th:text="${leader.gamesPlayed}">0</span>
                        <span class="ms-leader-stat-lbl">GP</span>
                    </th:block>
                    <th:block th:case="'WINS'">
                        <span class="ms-leader-stat-val" th:text="${leader.wins}">0</span>
                        <span class="ms-leader-stat-lbl">W</span>
                    </th:block>
                    <th:block th:case="'LOSSES'">
                        <span class="ms-leader-stat-val" th:text="${leader.losses}">0</span>
                        <span class="ms-leader-stat-lbl">L</span>
                    </th:block>
                    <th:block th:case="'TIES'">
                        <span class="ms-leader-stat-val" th:text="${leader.ties}">0</span>
                        <span class="ms-leader-stat-lbl">T</span>
                    </th:block>
                    <th:block th:case="'POINTS'">
                        <span class="ms-leader-stat-val" th:text="${leader.points}">0</span>
                        <span class="ms-leader-stat-lbl">P</span>
                    </th:block>
                    <th:block th:case="'POINT_PERCENTAGE'">
                        <span class="ms-leader-stat-val"
                              th:text="${leader.gamesPlayed > 0} ? ${#numbers.formatDecimal(leader.points * 1.0 / (leader.gamesPlayed * 2), 1, 2)} : '0.00'">0.00</span>
                        <span class="ms-leader-stat-lbl">P%</span>
                    </th:block>
                    <th:block th:case="'GOALS_FOR'">
                        <span class="ms-leader-stat-val" th:text="${leader.goalsFor}">0</span>
                        <span class="ms-leader-stat-lbl">GF</span>
                    </th:block>
                    <th:block th:case="'GOALS_AGAINST'">
                        <span class="ms-leader-stat-val" th:text="${leader.goalsAgainst}">0</span>
                        <span class="ms-leader-stat-lbl">GA</span>
                    </th:block>
                    <th:block th:case="'PENALTY_MINUTES'">
                        <span class="ms-leader-stat-val" th:text="${leader.penaltyMinutes}">0</span>
                        <span class="ms-leader-stat-lbl">PIM</span>
                    </th:block>
                </div>
            </div>
            <div class="ms-tile">
                <span class="ms-tile-label">Sorted By</span>
                <span class="ms-tile-value" th:text="${#strings.capitalizeWords(#strings.toLowerCase(#strings.replace(sf, '_', ' ')))}">Points</span>
                <span class="ms-tile-sub" th:text="${so == 'ASC'} ? 'Ascending' : 'Descending'">Descending</span>
            </div>
        </section>

        <!-- Toolbar -->
        <section class="ms-toolbar">
            <div class="ms-segmented">
                <a th:href="@{/standings(season-type='REGULAR_SEASON', year=${yr})}"
                   th:classappend="${st == 'REGULAR_SEASON'} ? 'active' : ''">Regular Season</a>
                <a th:href="@{/standings(season-type='PLAYOFFS', year=${yr})}"
                   th:classappend="${st == 'PLAYOFFS'} ? 'active' : ''">Playoffs</a>
            </div>

            <span class="ms-spacer"></span>

            <form th:action="@{/standings}" method="get" id="year-select-form">
                <input type="hidden" name="season-type" th:value="${st}" />
                <select name="year" id="year" class="ms-select" aria-label="Season year" required
                        onchange="document.getElementById('year-select-form').submit();">
                    <option th:each="season_year : ${season_years}"
                            th:value="${season_year}"
                            th:text="${season_year}"
                            th:selected="${season_year == yr}">
                    </option>
                </select>
            </form>
        </section>

        <!-- Standings table -->
        <section class="ms-card">
            <div class="ms-scroll">
                <table class="ms-table ms-standings">
                    <thead>
                    <tr>
                        <th class="ms-rank-col" aria-label="Position">#</th>
                        <th class="ms-left ms-team-col">Team</th>
                        <th th:replace="~{fragments/modern-standings-sort-header :: sortHeader('GP', 'Games Played', 'GAMES_PLAYED', ${so}, ${sf}, ${st}, ${yr})}"></th>
                        <th th:replace="~{fragments/modern-standings-sort-header :: sortHeader('W', 'Wins', 'WINS', ${so}, ${sf}, ${st}, ${yr})}"></th>
                        <th th:replace="~{fragments/modern-standings-sort-header :: sortHeader('L', 'Losses', 'LOSSES', ${so}, ${sf}, ${st}, ${yr})}"></th>
                        <th th:replace="~{fragments/modern-standings-sort-header :: sortHeader('T', 'Ties', 'TIES', ${so}, ${sf}, ${st}, ${yr})}"></th>
                        <th th:replace="~{fragments/modern-standings-sort-header :: sortHeader('P', 'Points', 'POINTS', ${so}, ${sf}, ${st}, ${yr})}"></th>
                        <th th:replace="~{fragments/modern-standings-sort-header :: sortHeader('P%', 'Point Percentage', 'POINT_PERCENTAGE', ${so}, ${sf}, ${st}, ${yr})}"></th>
                        <th th:replace="~{fragments/modern-standings-sort-header :: sortHeader('GF', 'Goals For', 'GOALS_FOR', ${so}, ${sf}, ${st}, ${yr})}"></th>
                        <th th:replace="~{fragments/modern-standings-sort-header :: sortHeader('GA', 'Goals Against', 'GOALS_AGAINST', ${so}, ${sf}, ${st}, ${yr})}"></th>
                        <th th:replace="~{fragments/modern-standings-sort-header :: sortHeader('PIM', 'Penalty Minutes', 'PENALTY_MINUTES', ${so}, ${sf}, ${st}, ${yr})}"></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="stat, iter : ${teamStats}">
                        <td class="ms-rank-col">
                            <span class="ms-rank"
                                  th:classappend="${iter.count == 1} ? 'podium podium-1' : (${iter.count == 2} ? 'podium podium-2' : (${iter.count == 3} ? 'podium podium-3' : ''))"
                                  th:text="${iter.count}">1</span>
                        </td>
                        <td class="ms-left ms-team-col">
                            <div class="ms-team-cell">
                                <img class="ms-logo"
                                     th:src="@{'/assets/teamLogos/' + ${utils.stripSpaces(stat.teamName)} + '.svg'}"
                                     th:alt="${stat.teamName}" th:title="${stat.teamName}"
                                     onerror="this.hidden=true;this.nextElementSibling.hidden=false;" />
                                <!-- fallback if a team has no logo file -->
                                <span class="ms-team" hidden th:text="${utils.abbreviateTeamName(stat.teamName)}">TEAM</span>
                                <span class="ms-team-name" th:text="${stat.teamName}">Team Name</span>
                            </div>
                        </td>
                        <td th:classappend="${sf == 'GAMES_PLAYED'} ? 'is-sorted'" th:text="${stat.gamesPlayed}">0</td>
                        <td th:classappend="${sf == 'WINS'} ? 'is-sorted'" th:text="${stat.wins}">0</td>
                        <td th:classappend="${sf == 'LOSSES'} ? 'is-sorted'" th:text="${stat.losses}">0</td>
                        <td th:classappend="${sf == 'TIES'} ? 'is-sorted'" th:text="${stat.ties}">0</td>
                        <td th:classappend="${sf == 'POINTS'} ? 'is-sorted'" th:text="${stat.points}">0</td>
                        <td th:classappend="${sf == 'POINT_PERCENTAGE'} ? 'is-sorted'"
                            th:text="${stat.gamesPlayed > 0} ? ${#numbers.formatDecimal(stat.points * 1.0 / (stat.gamesPlayed * 2), 1, 2)} : '0.00'">0.00</td>
                        <td th:classappend="${sf == 'GOALS_FOR'} ? 'is-sorted'" th:text="${stat.goalsFor}">0</td>
                        <td th:classappend="${sf == 'GOALS_AGAINST'} ? 'is-sorted'" th:text="${stat.goalsAgainst}">0</td>
                        <td th:classappend="${sf == 'PENALTY_MINUTES'} ? 'is-sorted'" th:text="${stat.penaltyMinutes}">0</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(teamStats)}">
                        <td colspan="11" class="ms-empty">No standings available for this season yet.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <div th:replace="~{fragments/footer.html :: footer}"></div>
</body>
</html>
