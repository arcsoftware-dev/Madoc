<footer class="main-footer" th:fragment="footer" xmlns:sec="http://www.thymeleaf.org/extras/spring-security6">
    <div class="footer-inner">
        <a th:href="@{/}" class="footer-brand">
            <img th:src="@{/assets/mmhl.svg}" alt="MMHL Logo" class="footer-logo" />
            <span class="footer-brand-name">Madoc Mens Hockey League</span>
        </a>

        <div class="footer-meta">
            <span th:text="|&copy; ${#dates.year(#dates.createNow())} Arc Software|">&copy; 2025 Arc Software</span>
            <span class="footer-views" th:if="${viewCount != null}">
                <span class="footer-views-dot" aria-hidden="true"></span>
                <span th:text="|${viewCount} views|">0 views</span>
            </span>
            <a class="footer-social-link"
               href="https://www.youtube.com/@MadocMHL"
               target="_blank"
               rel="noopener noreferrer"
               aria-label="Madoc MHL YouTube Channel">
                <svg class="footer-social-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M23.5 6.2a3.02 3.02 0 0 0-2.12-2.14C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.38.56A3.02 3.02 0 0 0 .5 6.2 31.6 31.6 0 0 0 0 12a31.6 31.6 0 0 0 .5 5.8 3.02 3.02 0 0 0 2.12 2.14c1.88.56 9.38.56 9.38.56s7.5 0 9.38-.56a3.02 3.02 0 0 0 2.12-2.14A31.6 31.6 0 0 0 24 12a31.6 31.6 0 0 0-.5-5.8ZM9.6 15.6V8.4l6.3 3.6-6.3 3.6Z"/>
                </svg>
                <span>YouTube</span>
            </a>
        </div>

        <div class="footer-auth" sec:authorize="isAnonymous()">
            <a class="footer-auth-btn" th:href="@{/login}">Admin Login</a>
        </div>
        <div class="footer-auth" sec:authorize="isAuthenticated()">
            <span class="footer-user">
                <span class="footer-user-label">Signed in as</span>
                <strong sec:authentication="name">user</strong>
            </span>
            <a class="footer-auth-btn logout" th:href="@{/logout}">Logout</a>
        </div>
    </div>
</footer>
